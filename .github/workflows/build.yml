# Builds and tests every commit. Pushes to main also publish a signed APK as a GitHub Release, so
# https://github.com/augustopedroza/instant-recorder/releases/latest/download/instant-recorder.apk
# always serves the newest build (and Obtainium can follow the releases).
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"] # documentation-only pushes don't need a new release
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # whisper.cpp
          fetch-depth: 0 # full history: the build number is the commit count

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "ndk;28.2.13676358" "cmake;3.31.5" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build number
        id: version
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Pull requests (which can come from forks) never see the signing key; they get a debug-signed APK.
      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk instant-recorder.apk

      - uses: actions/upload-artifact@v7
        with:
          name: instant-recorder-build-${{ steps.version.outputs.code }}
          path: instant-recorder.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=${{ steps.version.outputs.code }}
          {
            git log -1 --format='%s%n%n%b' | grep -v '^Co-Authored-By:'
            echo
            echo "Install: download \`instant-recorder.apk\` on your phone and open it. First time? See the [install guide](https://github.com/${{ github.repository }}#install)."
          } > notes.md
          gh release create "build-$code" instant-recorder.apk \
            --target "$GITHUB_SHA" \
            --title "Instant Recorder 0.1 (build $code)" \
            --notes-file notes.md
